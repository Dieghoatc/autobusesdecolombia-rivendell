<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts used to render the watermark text. Only the fonts bundled in this repo are
     used, so the output is the same on any server, with or without system fonts. -->
<fontconfig>
  <dir prefix="relative">fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <!-- Arial has no bold file here: synthesize bold for font-weight: bold -->
  <match target="font">
    <test target="font" name="weight" compare="less_eq"><const>medium</const></test>
    <test target="pattern" name="weight" compare="more_eq"><const>bold</const></test>
    <edit name="embolden" mode="assign"><bool>true</bool></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
</fontconfig>
